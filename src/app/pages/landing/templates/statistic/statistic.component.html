<section
    #statSection 
    class="w-screen h-[80vh] md:h-44 grid grid-cols-2 md:grid-cols-4 border-t border-clr-border-color"
    >
    <div
        class="flex flex-col items-center justify-center border-r border-b border-clr-border-color"
        >
        <h2 
            class="title-1 text-clr-text-secondary!"
            >
            {{projectCount }}
        </h2>
        <p
            class="text-base secondary"
            >
            Projets réalisés
        </p>
    </div>

    <div
        class="flex flex-col items-center justify-center border-r border-b border-clr-border-color"
        >
        <h2
            class="title-1 text-clr-text-secondary!"
            >
            +{{userCount}}
        </h2>
        <p
            class="text-base secondary"
            >
            Utilisateurs
        </p>
    </div>
    
    <div
        class="flex flex-col items-center justify-center border-r border-b border-clr-border-color"
        >
        <h2
            class="title-1 text-clr-text-secondary!"
            >
            {{partnerCount}}
        </h2>
        <p
            class="text-base secondary"
            >
            Partenaires
        </p>
    </div>
    <div
        class="flex flex-col items-center justify-center border-r border-b border-clr-border-color"
        >
        <h2
            class="title-1 text-clr-text-secondary!"
            >
            {{satisfaction}}%
        </h2>
        <p
            class="text-base secondary"
            >
            satisfaction client
        </p>
    </div>
</section>
