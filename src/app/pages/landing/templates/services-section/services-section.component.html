<section
    class="w-full relative flex flex-col py-section-y p-main gap-lg"
    >
    <span
        class="text-center"
        >
        <p 
            appEntryAnim
            [delay]="100"
            [threshold]="0.6"
            [translateY]="50"
            [speed]="500"
            class="text-caption opacity-0">
            nos services
        </p>
        <h2 
            appEntryAnim
            [delay]="200"
            [threshold]="0.6"
            [translateY]="50"
            [speed]="500"
            class="title-3 opacity-0">
            Lorem ipsum dolor sit amet.
        </h2>
    </span>
    <div
        class="w-full grid gird-cols1 gap-main"
        >
        <div
            class="grid grid-cols-1 md:grid-cols-2 gap-main"
            >
            @for (item of services; track $index) {
                <article
                    appEntryAnim
                    [delay]="100"
                    [threshold]="0.6"
                    [translateY]="5"
                    [speed]="500"
                    class="card h-[70vh] max-h-140 flex flex-col relative overflow-hidden opacity-0"
                    >
                    <span
                        class="w-full h-7/10 relative overflow-hidden group"
                        >
                        <img 
                            [src]="item.image" 
                            alt="service image "
                            loading="lazy"
                            class="w-full h-full transition-morph-low duration-300 group-hover:scale-120"
                        >
                    </span>
                    <span
                        class="w-full h-3/10 flex flex-col justify-center"
                        >
                        <h3 class="text-clr-text-accent font-medium">{{item.name}}</h3>
                        <p class="text-base-xs">{{item.description}}</p> 
                    </span>
                </article>
            }
        </div>
        <div
            class="grid grid-cols-2 lg:grid-cols-3 gap-main"
            >
            @for (item of clauses; track $index) {
                <article
                    appEntryAnim
                    [delay]="100"
                    [threshold]="0.6"
                    [translateY]="25"
                    [speed]="500"
                    class="card h-32 flex gap-sm relative opacity-0 nth-[3]:col-span-2 lg:nth-[3]:col-span-1"
                    >
                    <span
                        class="w-3/10 h-full flex items-center justify-center"
                        >
                        <p class="{{item.icon}} text-5xl!"></p>
                    </span>
                    <span 
                        class="flex flex-col justify-center"
                        >
                        <p class="text-clr-text-accent! font-semibold text-base-xs"> {{item.title}} </p>
                        <p class="text-base-xs">{{item.description}}</p>
                    </span>
                </article>
            }
        </div>
    </div>
</section>
